name: Release GUI Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows GUI EXE
        run: python\build_service_gui_exe.bat

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdenv-service-gui-windows
          path: dist/sdenv-service-gui.exe
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS Apple Silicon Binary
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build macOS GUI Binary
        run: bash python/build_service_gui_macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdenv-service-gui-macos-arm64
          path: dist/sdenv-service-gui-macos-arm64
          if-no-files-found: error

  release:
    name: Upload Assets To Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdenv-service-gui-windows
          path: dist

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdenv-service-gui-macos-arm64
          path: dist

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sdenv-service-gui.exe
            dist/sdenv-service-gui-macos-arm64
